
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rainbow Transformer Hero</title>

<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;background:#11152d;color:white;font-family:Arial;overflow:hidden}
#gameScreen{width:100vw;height:100dvh;display:flex;flex-direction:column;background:#171c42}
#topbar{
 height:40px;flex-shrink:0;display:flex;align-items:center;
 justify-content:space-around;gap:3px;
 background:linear-gradient(90deg,#ff299a,#7138ed,#05b8dc);
 font-size:clamp(10px,2vw,16px);font-weight:bold
}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block;object-fit:contain}
#mobileControls{position:absolute;inset:0;pointer-events:none}
#joystick{
 position:absolute;left:2%;bottom:5%;width:clamp(85px,17vw,140px);
 aspect-ratio:1;border-radius:50%;background:#ffffff28;
 border:2px solid #ffffff99;backdrop-filter:blur(4px);
 pointer-events:auto;box-shadow:0 0 18px #ffffff30
}
#stick{
 position:absolute;width:40%;height:40%;left:30%;top:30%;
 border-radius:50%;background:#ffffffa8;border:2px solid white;
 box-shadow:0 0 12px white
}
.action{
 position:absolute;pointer-events:auto;border-radius:50%;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 color:white;font-weight:bold;border:2px solid white;
 backdrop-filter:blur(5px);user-select:none;
 box-shadow:0 0 15px #ffffff55
}
.action span{font-size:clamp(23px,5vw,38px)}
.action small{font-size:clamp(8px,1.5vw,12px)}
#fire{width:clamp(67px,13vw,105px);aspect-ratio:1;right:3%;bottom:7%;background:#ff267cbd}
#bomb{width:clamp(53px,10vw,80px);aspect-ratio:1;right:19%;bottom:5%;background:#ff9c20bd}
#transformBtn{width:clamp(52px,10vw,75px);aspect-ratio:1;right:3%;top:5%;background:#9146e5bd}
#message{
 position:absolute;top:4%;left:50%;transform:translateX(-50%);
 font-weight:bold;font-size:clamp(10px,2vw,17px);
 text-shadow:2px 2px #552070;text-align:center;
 width:65%;pointer-events:none
}
#startScreen{
 position:fixed;z-index:20;inset:0;display:flex;
 flex-direction:column;justify-content:center;align-items:center;
 padding:20px;overflow:auto;
 background:linear-gradient(135deg,#ff45a4,#6939e7,#12a7e0);
 border:4px solid #fff36a;border-radius:22px;text-align:center
}
#startScreen h1{
 color:#fff34c;font-size:clamp(25px,5vw,45px);
 text-shadow:3px 4px #9e247d
}
#startScreen button{
 padding:15px 35px;border:3px solid white;border-radius:16px;
 background:#fff23b;font-size:20px;font-weight:bold;color:#512080
}
#rotateMessage{
 display:none;position:fixed;inset:0;z-index:100;
 background:#17102f;align-items:center;justify-content:center;
 text-align:center;padding:25px;font-size:23px
}
@media(orientation:portrait){
 #rotateMessage{display:flex}
}
</style>
</head>

<body>

<div id="gameScreen">
 <div id="topbar">
  <span id="hp">❤️ 3</span>
  <span id="score">⭐ 0</span>
  <span id="gems">💎 0</span>
  <span id="bombs">💣 3</span>
  <span id="level">🏆 LEVEL 1</span>
 </div>

 <div id="stage">
  <canvas id="game" width="900" height="500"></canvas>
  <div id="message">MISI: KALAHKAN SEMUA MUSUH!</div>

  <div id="mobileControls">
   <div id="joystick"><div id="stick"></div></div>
   <div class="action" id="fire"><span>🔫</span><small>TEMBAK</small></div>
   <div class="action" id="bomb"><span>💣</span><small>BOM</small></div>
   <div class="action" id="transformBtn"><span>🚗</span><small>TRANSFORM</small></div>
  </div>
 </div>
</div>

<div id="startScreen">
 <h1>🌈 RAINBOW TRANSFORMER HERO 🌈</h1>
 <h2 id="startSubtitle">🚗 TRANSFORM • 🔫 SHOOT • 💣 BOOM</h2>
 <p>5 PERINGKAT • 5 SOALAN SOLAT • BOSS TERAKHIR</p>
 <button id="startButton" onclick="startGame()">▶ MULA BERMAIN</button>
 <p>Gunakan telefon secara landscape.</p>
</div>

<div id="rotateMessage">
 <div>📱<br><br>
 SILA PUSING TELEFON KE LANDSCAPE<br><br>
 <small>Untuk pengalaman permainan terbaik.</small>
 </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player={x:100,y:220};
let bullets=[],enemies=[],enemyShots=[],items=[],particles=[];

let score=0,gems=0,hp=3,hits=0;
let level=1,kills=0;

const PLAYER_MAX_HITS=3;
const ENEMY_MAX_HP=5;

let active=false,paused=false,flying=false;
let boss=null,bossSpawned=false;
let bombCount=3,bombCooldown=0;
let shootHeld=false,lastShot=0;
let lastSpawn=0,lastItem=0;
let gameTime=0,lastTime=0;
let joy={x:0,y:0};
let keys={};
let audioCtx=null;

// Kawalan supaya pemain tidak terkena berulang kali
// dalam masa yang terlalu singkat.
let lastDamage=0;
const DAMAGE_COOLDOWN=1000;

// =========================
// PERINGKAT PERMAINAN
// =========================

const stages=[
 {name:"MUDAH",speed:80,fire:.012,interval:1100},
 {name:"SEDANG",speed:110,fire:.020,interval:900},
 {name:"SUSAH SIKIT",speed:140,fire:.030,interval:750},
 {name:"SUSAH",speed:175,fire:.045,interval:600},
 {name:"AMAT SUSAH",speed:210,fire:.060,interval:450}
];

// =========================
// GAMBAR WATAK
// =========================

function makeSprite(svg){

 img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);

}

const car=makeSprite(`

<defs>
<linearGradient id="b" x2="0" y2="1">
<stop stop-color="#ffb4e1"/><stop offset=".4" stop-color="#ff287b"/>
<stop offset="1" stop-color="#a90050"/></linearGradient>
<linearGradient id="g"><stop stop-color="#b9faff"/><stop offset="1" stop-color="#1680be"/></linearGradient>
</defs>
<ellipse cx="90" cy="88" rx="80" ry="7" fill="#183d55" opacity=".3"/>
<path d="M12 65 L19 42 Q23 35 43 33 L65 12 Q72 5 94 8 L126 18 Q137 24 143 43 L164 50 Q174 54 174 69 L169 77 L8 77Z" fill="url(#b)" stroke="#6b1649" stroke-width="3"/>
<path d="M48 34 L69 14 Q74 11 92 13 L107 18 L117 37Z" fill="url(#g)" stroke="white" stroke-width="2"/>
<path d="M121 23 L135 42 L113 37 L101 18Z" fill="url(#g)" stroke="white" stroke-width="2"/>
<path d="M15 53 Q83 44 158 54" fill="none" stroke="#ffb9dc" stroke-width="4"/>
<path d="M15 65 L31 61 L34 70 L13 70Z" fill="#fff6a0"/>
<circle cx="47" cy="75" r="17" fill="#25233b" stroke="#ddd" stroke-width="3"/>
<circle cx="47" cy="75" r="8" fill="#9ab6c7"/>
<circle cx="137" cy="75" r="17" fill="#25233b" stroke="#ddd" stroke-width="3"/>
<circle cx="137" cy="75" r="8" fill="#9ab6c7"/>
</svg>`);

const plane=makeSprite(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110">
<defs><linearGradient id="p" x2="0" y2="1">
<stop stop-color="#fff47a"/><stop offset=".4" stop-color="#ffb52b"/>
<stop offset="1" stop-color="#e05b12"/></linearGradient></defs>
<path d="M12 48 L66 41 L91 4 L112 5 L106 42 L160 48 Q171 51 160 57 L107 65 L114 94 L99 96 L72 67 L14 61 Q2 57 12 48Z" fill="url(#p)" stroke="#a34b10" stroke-width="3"/>
<path d="M48 47 L76 46 L87 28 L100 27 L96 46 L146 51 L96 56 L83 54Z" fill="#a4efff" stroke="white" stroke-width="2"/>
</svg>`);

const monsterSVGs=[
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
<defs><linearGradient id="r"><stop stop-color="#ffb25a"/><stop offset="1" stop-color="#d92345"/></linearGradient></defs>
<path d="M22 43 L12 22 L35 29 Q55 3 80 29 L106 18 L95 49 L102 78 L80 91 L35 91 L15 75Z" fill="url(#r)" stroke="#6d153e" stroke-width="4"/>
<path d="M29 48 Q60 24 89 48 L84 73 L35 73Z" fill="#ffdf7b"/>
<ellipse cx="43" cy="52" rx="10" ry="13" fill="white"/><ellipse cx="76" cy="52" rx="10" ry="13" fill="white"/>
<circle cx="45" cy="54" r="5" fill="#321c48"/><circle cx="75" cy="54" r="5" fill="#321c48"/>
<path d="M39 80 Q59 99 82 79" fill="none" stroke="#54203a" stroke-width="5"/>
</svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
<defs><linearGradient id="b"><stop stop-color="#b7a0ff"/><stop offset="1" stop-color="#5933c8"/></linearGradient></defs>
<path d="M30 25 L17 9 L43 15 L59 4 L74 16 L101 8 L91 35 L106 69 L85 94 L30 94 L12 70Z" fill="url(#b)" stroke="#302071" stroke-width="4"/>
<rect x="25" y="35" width="70" height="38" rx="15" fill="#4b287e"/>
<circle cx="45" cy="52" r="12" fill="#b4ffff"/><circle cx="77" cy="52" r="12" fill="#b4ffff"/>
<circle cx="45" cy="52" r="5" fill="#322052"/><circle cx="77" cy="52" r="5" fill="#322052"/>
<path d="M43 77 Q60 90 82 76" stroke="white" stroke-width="4" fill="none"/>
</svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
<defs><linearGradient id="g"><stop stop-color="#aaff82"/><stop offset="1" stop-color="#1a9b60"/></linearGradient></defs>
<path d="M20 43 L8 20 L34 30 L53 8 L68 27 L100 16 L91 45 L106 75 L82 94 L30 94 L13 73Z" fill="url(#g)" stroke="#126343" stroke-width="4"/>
<ellipse cx="60" cy="57" rx="35" ry="28" fill="#168456"/>
<circle cx="43" cy="49" r="12" fill="white"/><circle cx="77" cy="49" r="12" fill="white"/>
<circle cx="45" cy="51" r="6" fill="#163b35"/><circle cx="75" cy="51" r="6" fill="#163b35"/>
<path d="M37 76 Q60 95 84 76" fill="none" stroke="#d6ff9d" stroke-width="5"/>
</svg>`
];

const enemySprites=monsterSVGs.map(makeSprite);

const bossSprite=makeSprite(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170">
<defs><linearGradient id="boss" x2="0" y2="1">
<stop stop-color="#ff9be0"/><stop offset=".45" stop-color="#a52cff"/>
<stop offset="1" stop-color="#3d147d"/></linearGradient></defs>
<path d="M35 45 L18 9 L62 25 L90 2 L117 25 L161 9 L144 48 L167 105 L132 145 L48 145 L13 105Z" fill="url(#boss)" stroke="#40126f" stroke-width="6"/>
<path d="M35 52 Q90 28 145 52 L137 112 L45 112Z" fill="#6227a0"/>
<path d="M40 66 L70 57 L77 88 L44 91Z M104 57 L138 66 L134 91 L101 88Z" fill="#fff15c"/>
<circle cx="60" cy="75" r="9" fill="#e9004e"/><circle cx="120" cy="75" r="9" fill="#e9004e"/>
<path d="M59 115 Q90 142 122 115" stroke="white" stroke-width="7" fill="none"/>
</svg>`);

// =========================
// BUNYI
// =========================

function sound(freq=500,duration=.15,type="square"){
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();

  let o=audioCtx.createOscillator();
  let g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(.09,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  o.start();o.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

function say(t){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(t);
 u.lang="ms-MY";u.rate=.85;
 speechSynthesis.speak(u);
}

function message(t){
 document.getElementById("message").textContent=t;
}

// =========================
// HUD
// =========================

function updateHUD(){
 document.getElementById("hp").textContent="❤️ "+hp;
 document.getElementById("score").textContent="⭐ "+score;
 document.getElementById("gems").textContent="💎 "+gems;
 document.getElementById("bombs").textContent="💣 "+bombCount;
 document.getElementById("level").textContent=
 "🏆 LEVEL "+level;
}

// =========================
// MULA GAME
// =========================

async function startGame(){
 try{
  if(document.documentElement.requestFullscreen)
   await document.documentElement.requestFullscreen();
  if(screen.orientation?.lock)
   await screen.orientation.lock("landscape");
 }catch(e){}

 if(window.speechSynthesis)speechSynthesis.cancel();

 player={x:100,y:220};
 bullets=[];enemies=[];enemyShots=[];items=[];particles=[];

 score=0;gems=0;hp=3;hits=0;
 level=1;kills=0;
 boss=null;bossSpawned=false;
 flying=false;
 bombCount=3;bombCooldown=0;

 active=true;paused=false;shootHeld=false;
 joy={x:0,y:0};keys={};

 lastSpawn=0;lastItem=0;lastShot=0;
 gameTime=0;lastTime=0;
 lastDamage=0;

 document.getElementById("startScreen").style.display="none";
 document.getElementById("startSubtitle").textContent=
 "🚗 TRANSFORM • 🔫 SHOOT • 💣 BOOM";
 document.getElementById("startButton").textContent="▶ MULA BERMAIN";

 updateHUD();
 message("MISI BERMULA!");
 sound(650,.3,"sine");
 say("Misi bermula! Kalahkan semua musuh!");
}

// =========================
// TRANSFORM
// =========================

function transform(){
 if(!active||paused)return;
 flying=!flying;

 for(let i=0;i<24;i++)burst(player.x+35,player.y+25);

 sound(350,.35,"sawtooth");
 message(flying?"✈️ MOD KAPAL TERBANG!":"🚗 MOD KERETA!");
}

// =========================
// TEMBAKAN
// =========================

function shoot(){
 if(!active||paused||Date.now()-lastShot<230)return;

 lastShot=Date.now();
 bullets.push({x:player.x+75,y:player.y+30,used:false});
 sound(850,.09);
}

// =========================
// BOM
// =========================

function bomb(){
 if(!active||paused||bombCount<=0||Date.now()<bombCooldown)return;

 bombCount--;
 bombCooldown=Date.now()+1800;

 explosion(player.x+150,player.y+20);

 enemies.forEach(e=>{
  if(Math.abs(e.x-player.x)<360){
   e.hp-=3;
   if(e.hp<=0)killEnemy(e);
  }
 });

 enemies=enemies.filter(e=>!e.dead);

 if(boss){
  boss.hp-=3;
  if(boss.hp<=0)winGame();
 }

 enemyShots=enemyShots.filter(b=>Math.abs(b.x-player.x)>300);

 message("💣 BOOOOOOM!");
 updateHUD();
}

// =========================
// JOYSTICK
// =========================

const joyBase=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joyPointer=null;

function joystickMove(e){
 let r=joyBase.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let max=r.width*.34;
 let len=Math.hypot(dx,dy);

 if(len>max){dx=dx/len*max;dy=dy/len*max}

 joy.x=dx/max;
 joy.y=dy/max;
 stick.style.left=(30+joy.x*30)+"%";
 stick.style.top=(30+joy.y*30)+"%";
}

function joystickEnd(){
 joy.x=0;joy.y=0;
 stick.style.left="30%";
 stick.style.top="30%";
}

joyBase.addEventListener("pointerdown",e=>{
 e.preventDefault();
 joyPointer=e.pointerId;
 joyBase.setPointerCapture(e.pointerId);
 joystickMove(e);
});

joyBase.addEventListener("pointermove",e=>{
 if(e.pointerId===joyPointer)joystickMove(e);
});

joyBase.addEventListener("pointerup",e=>{
 if(e.pointerId===joyPointer){
  joyPointer=null;
  joystickEnd();
 }
});

joyBase.addEventListener("pointercancel",()=>{
 joyPointer=null;
 joystickEnd();
});

// =========================
// BUTANG TELEFON
// =========================

const fireBtn=document.getElementById("fire");

fireBtn.addEventListener("pointerdown",e=>{
 e.preventDefault();
 shootHeld=true;
 fireBtn.setPointerCapture(e.pointerId);
 shoot();
});

function stopFire(){shootHeld=false}

fireBtn.addEventListener("pointerup",stopFire);
fireBtn.addEventListener("pointercancel",stopFire);
fireBtn.addEventListener("lostpointercapture",stopFire);

document.getElementById("bomb").addEventListener("pointerdown",e=>{
 e.preventDefault();
 bomb();
});

document.getElementById("transformBtn").addEventListener("pointerdown",e=>{
 e.preventDefault();
 transform();
});

// =========================
// KEYBOARD
// =========================

document.addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();

 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))
  e.preventDefault();

 keys[k]=true;

 if(k===" ")shoot();
 if(k==="t")transform();
 if(k==="b")bomb();
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function getMovement(){
 let x=joy.x;
 let y=joy.y;

 if(keys.arrowleft||keys.a)x-=1;
 if(keys.arrowright||keys.d)x+=1;
 if(keys.arrowup||keys.w)y-=1;
 if(keys.arrowdown||keys.s)y+=1;

 let len=Math.hypot(x,y);
 if(len>1){x/=len;y/=len}

 return{x,y};
}

// =========================
// LETUPAN
// =========================

function burst(x,y){
 particles.push({
  x,y,
  vx:(Math.random()-.5)*7,
  vy:(Math.random()-.5)*7,
  life:35,
  color:["#fff000","#ff3c9c","#31ffff","#8aff3c","#b56aff"][Math.floor(Math.random()*5)]
 });
}

function explosion(x,y){
 for(let i=0;i<35;i++)burst(x,y);
 sound(90,.35,"sawtooth");
 sound(150,.25,"square");
}

// =========================
// MUSUH
// =========================

function killEnemy(e){
 if(e.dead)return;

 e.dead=true;
 score+=100;
 kills++;

 explosion(e.x,e.y);

 if(Math.random()<.65){
  items.push({
   x:e.x,y:e.y,
   type:Math.floor(Math.random()*3)
  });
 }

 updateHUD();
}

function spawnEnemy(){
 if(enemies.length>=12||boss||level===5&&kills>=6)return;

 let type=Math.floor(Math.random()*enemySprites.length);

 enemies.push({
  x:930+Math.random()*100,
  y:40+Math.random()*390,
  baseY:40+Math.random()*390,
  hp:ENEMY_MAX_HP,
  type,
  dead:false,
  phase:Math.random()*6
 });
}

function spawnItem(){
 items.push({
  x:930,
  y:40+Math.random()*400,
  type:Math.floor(Math.random()*3)
 });
}

function collision(a,b,d=35){
 return Math.abs(a.x-b.x)<d&&Math.abs(a.y-b.y)<d;
}

// =========================
// GAME OVER
// =========================

function gameOver(){
 if(!active)return;

 active=false;
 paused=false;
 shootHeld=false;

 hp=0;
 score=0;
 gems=0;
 hits=0;
 level=1;
 kills=0;
 bombCount=3;

 bullets=[];
 enemies=[];
 enemyShots=[];
 items=[];
 particles=[];
 boss=null;
 bossSpawned=false;

 joy={x:0,y:0};
 keys={};

 updateHUD();

 message("💀 GAME OVER!");

 sound(100,.7,"sawtooth");
 say("Game over! Cuba lagi.");

 document.getElementById("startScreen").style.display="flex";

 document.getElementById("startSubtitle").textContent=
 "💀 GAME OVER! SKOR DAN GEM KEMBALI KE SIFAR!";

 document.getElementById("startButton").textContent=
 "🔄 MAIN SEMULA";
}

// =========================
// PEMAIN TERKENA MUSUH
// =========================

function damage(){
 if(!active||paused)return;

 let now=Date.now();

 // Elak nyawa berkurang terlalu cepat
 if(now-lastDamage<DAMAGE_COOLDOWN)return;

 lastDamage=now;

 hp--;
 hits++;

 sound(110,.25,"sawtooth");
 updateHUD();

 if(hits>=PLAYER_MAX_HITS){
  gameOver();
  return;
 }

 message("AWAS! TERKENA MUSUH! "+(3-hits)+" PELUANG LAGI!");
}

// =========================
// PERINGKAT SETERUSNYA
// =========================

function nextLevel(){
 if(level>=5)return;

 level++;
 kills=0;
 enemies=[];
 enemyShots=[];
 bullets=[];
 boss=null;
 bossSpawned=false;

 lastSpawn=performance.now();

 message("TAHNIAH! PERINGKAT "+level+"!");
 sound(700,.5,"sine");
 say("Tahniah! Peringkat "+level);

 updateHUD();
}

// =========================
// MENANG
// =========================

function winGame(){
 if(!active)return;

 if(boss){
  explosion(boss.x,boss.y);
  score+=1000;
  boss=null;
 }

 active=false;
 shootHeld=false;
 paused=false;

 message("🏆 ANDA JUARA!");
 sound(1000,.6,"sine");
 say("Tahniah! Anda juara! Semua peringkat selesai!");

 document.getElementById("startScreen").style.display="flex";

 document.getElementById("startSubtitle").textContent=
 "🏆 TAHNIAH! SKOR AKHIR: "+score;

 document.getElementById("startButton").textContent="MAIN SEMULA";
}

// =========================
// LATAR BELAKANG
// =========================

function background(){
 let g=ctx.createLinearGradient(0,0,0,500);
 g.addColorStop(0,"#21caff");
 g.addColorStop(.65,"#b1f6ff");
 g.addColorStop(1,"#fff0ad");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,900,500);

 ctx.fillStyle="#fff34b";
 ctx.beginPath();
 ctx.arc(770,75,43,0,7);
 ctx.fill();

 ctx.fillStyle="#a18ae1";
 ctx.beginPath();
 ctx.moveTo(0,330);
 ctx.lineTo(170,125);
 ctx.lineTo(340,340);
 ctx.lineTo(500,170);
 ctx.lineTo(720,345);
 ctx.lineTo(900,190);
 ctx.lineTo(900,420);
 ctx.lineTo(0,420);
 ctx.fill();

 for(let i=0;i<10;i++){
  let x=i*100;
  let h=65+(i*37)%100;

  ctx.fillStyle=["#ff77b7","#ffca52","#67caff","#8f72df"][i%4];
  ctx.fillRect(x,420-h,72,h);

  ctx.fillStyle="#fff5a2";

  for(let y=430-h;y<405;y+=22){
   for(let z=x+12;z<x+65;z+=23){
    ctx.fillRect(z,y,10,12);
   }
  }
 }

 ctx.fillStyle="#515d85";
 ctx.fillRect(0,440,900,60);

 ctx.fillStyle="white";

 for(let x=0;x<900;x+=100)
  ctx.fillRect(x,468,45,6);

 ctx.fillStyle="white";

 for(let i=0;i<4;i++){
  let x=(i*245+60+gameTime*30)%1000-60;
  let y=75+i%2*65;

  ctx.beginPath();
  ctx.arc(x,y,23,0,7);
  ctx.arc(x+27,y-10,30,0,7);
  ctx.arc(x+58,y,24,0,7);
  ctx.fill();
 }
}

// =========================
// LUKIS PERMAINAN
// =========================

function draw(){
 background();

 let vehicle=flying?plane:car;

 if(vehicle.complete&&vehicle.naturalWidth){
  ctx.drawImage(vehicle,player.x,player.y,105,65);
 }

 // Peluru pemain
 bullets.forEach(b=>{
  ctx.save();
  ctx.shadowBlur=16;
  ctx.shadowColor="#ff7200";
  ctx.fillStyle="#fff400";
  ctx.beginPath();
  ctx.ellipse(b.x,b.y,15,5,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 });

 // Musuh dan bar nyawa
 enemies.forEach(e=>{
  let img=enemySprites[e.type];

  if(img.complete&&img.naturalWidth){
   ctx.drawImage(img,e.x,e.y,78,78);
  }

  ctx.fillStyle="#ff3434";
  ctx.fillRect(e.x,e.y-9,75,7);

  ctx.fillStyle="#53f65d";
  ctx.fillRect(
   e.x,e.y-9,
   75*Math.max(0,e.hp/ENEMY_MAX_HP),7
  );

  ctx.fillStyle="white";
  ctx.font="bold 12px Arial";
  ctx.fillText(e.hp+"/5",e.x+23,e.y-14);
 });

 // Harta
 items.forEach(t=>{
  ctx.font="35px Arial";
  ctx.fillText(["🪙","💎","🦪"][t.type],t.x,t.y);
 });

 // Peluru musuh
 enemyShots.forEach(b=>{
  ctx.font="23px Arial";
  ctx.fillText("🔥",b.x,b.y);
 });

 // Boss
 if(boss&&bossSprite.complete&&bossSprite.naturalWidth){
  ctx.drawImage(bossSprite,boss.x,boss.y,160,150);

  ctx.fillStyle="#e92743";
  ctx.fillRect(boss.x,boss.y-14,150,10);

  ctx.fillStyle="#4bfa65";
  ctx.fillRect(boss.x,boss.y-14,150*boss.hp/30,10);

  ctx.fillStyle="white";
  ctx.font="bold 17px Arial";
  ctx.fillText("BOSS",boss.x+50,boss.y-20);
 }

 // Letupan
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/35);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,4,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 });
}

// =========================
// UPDATE GAME
// =========================

function update(dt){
 if(!active||paused)return;

 gameTime+=dt;

 // Gerakan pemain
 let movement=getMovement();

 player.x+=movement.x*260*dt;
 player.y+=movement.y*260*dt;

 player.x=Math.max(0,Math.min(790,player.x));
 player.y=Math.max(0,Math.min(425,player.y));

 // Tembakan automatik
 if(shootHeld)shoot();

 bullets.forEach(b=>b.x+=650*dt);

 let diff=stages[level-1];

 // Gerakan musuh
 enemies.forEach(e=>{
  e.x-=diff.speed*dt;
  e.y=e.baseY+Math.sin(gameTime*2+e.phase)*12;

  if(Math.random()<diff.fire*dt){
   enemyShots.push({
    x:e.x,
    y:e.y+35,
    used:false
   });
  }
 });

 // Peluru pemain mengenai musuh
 bullets.forEach(b=>{
  enemies.forEach(e=>{
   if(!b.used&&!e.dead&&collision(
    b,{x:e.x+38,y:e.y+38},43
   )){
    b.used=true;
    e.hp--;

    sound(230,.08);

    if(e.hp<=0)killEnemy(e);
   }
  });
 });

 bullets=bullets.filter(b=>b.x<930&&!b.used);
 enemies=enemies.filter(e=>!e.dead&&e.x>-100);

 // Boss terakhir
 if(level===5&&kills>=6&&!boss&&!bossSpawned){
  bossSpawned=true;
  enemies=[];

  boss={x:730,y:170,hp:30};

  say("Boss terakhir datang!");
  message("⚠️ BOSS TERAKHIR!");
 }

 if(boss){
  boss.x=Math.max(680,boss.x-10*dt);
  boss.y=160+Math.sin(gameTime*2)*25;

  if(Math.random()<.8*dt){
   enemyShots.push({
    x:boss.x,
    y:boss.y+65,
    used:false
   });
  }

  bullets.forEach(b=>{
   if(!b.used&&collision(
    b,{x:boss.x+70,y:boss.y+70},85
   )){
    b.used=true;
    boss.hp--;

    if(boss.hp<=0){
     winGame();
    }
   }
  });
 }

 // Peluru musuh terkena pemain
 enemyShots.forEach(b=>{
  b.x-=300*dt;

  if(!b.used&&collision(
   b,{x:player.x+45,y:player.y+30},35
  )){
   b.used=true;
   damage();
  }
 });

 enemyShots=enemyShots.filter(b=>b.x>0&&!b.used);

 // PEMAIN BERLANGGAR DENGAN MUSUH
 enemies.forEach(e=>{
  if(!e.dead&&collision(
   {x:player.x+50,y:player.y+32},
   {x:e.x+39,y:e.y+39},
   58
  )){
   damage();

   if(active){
    // Tolak sedikit musuh selepas perlanggaran
    e.x+=35;
   }
  }
 });

 // Harta karun
 items.forEach(t=>t.x-=120*dt);

 items=items.filter(t=>{
  if(collision(t,{x:player.x+45,y:player.y+30},42)){
   score+=t.type===1?50:20;
   gems++;

   sound(1100,.12,"sine");

   for(let i=0;i<12;i++)burst(t.x,t.y);

   return false;
  }

  return t.x>-50;
 });

 // Partikel
 particles.forEach(p=>{
  p.x+=p.vx;
  p.y+=p.vy;
  p.life-=60*dt;
 });

 particles=particles.filter(p=>p.life>0);

 // Peringkat 1 hingga 4
 if(level<5&&kills>=6){
  nextLevel();
 }

 updateHUD();
}

// =========================
// GAME LOOP
// =========================

function loop(now){
 let dt=Math.min((now-lastTime)/1000||0,.04);
 lastTime=now;

 if(active&&!paused){
  let diff=stages[level-1];

  if(now-lastSpawn>diff.interval){
   spawnEnemy();
   lastSpawn=now;
  }

  if(now-lastItem>3000){
   spawnItem();
   lastItem=now;
  }
 }

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

// =========================
// MULA
// =========================

updateHUD();
requestAnimationFrame(loop);

</script>
</body>
</html>
