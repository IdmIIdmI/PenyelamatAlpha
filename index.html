
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rainbow Transformer Hero</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:12px;text-align:center;
 color:white;font-family:Arial;
 background:linear-gradient(135deg,#ff49a5,#7148ee,#13bde9,#20cf9c);
}
h1{color:#fff34b;text-shadow:3px 4px #a21c92}
.panel{
 max-width:900px;margin:auto;padding:12px;
 border:3px solid white;border-radius:20px;
 background:#20134eea;
}
canvas{
 display:block;width:100%;height:auto;
 border:4px solid white;border-radius:15px;
 background:#70dafa;
}
.hud{display:flex;justify-content:space-around;flex-wrap:wrap;gap:7px}
.stat{background:#e62b9c;padding:9px;border-radius:12px;font-weight:bold}
button{
 padding:12px;margin:4px;border:2px solid white;
 border-radius:12px;background:linear-gradient(135deg,#fff34b,#ff9e29);
 color:#512080;font-weight:bold;font-size:15px;
}
#quiz{
 display:none;position:fixed;z-index:10;
 left:4%;top:5%;width:92%;max-height:90vh;
 overflow:auto;background:linear-gradient(135deg,#ff43a5,#713bdf,#19aee5);
 border:4px solid gold;border-radius:20px;padding:15px;
}
#answers button{display:block;width:100%}
#message{color:#fff34b;font-weight:bold}
</style>
</head>
<body>

<h1>🌈 RAINBOW TRANSFORMER HERO 🌈</h1>
<div class="panel">
 <div class="hud">
  <div class="stat" id="hp">❤️ 3</div>
  <div class="stat" id="score">⭐ 0</div>
  <div class="stat" id="gems">💎 0</div>
  <div class="stat" id="stage">LEVEL 1</div>
 </div>

 <br>
 <canvas id="game" width="900" height="500"></canvas>
 <p id="message">Tekan MULA untuk bermain!</p>

 <button onclick="start()">🚀 MULA GAME</button>
 <button onclick="transform()">🚗 / ✈️ TRANSFORM</button>
 <button onclick="shoot()">🔫 TEMBAK</button>

 <div>
  <button onclick="move(0,-30)">⬆️</button><br>
  <button onclick="move(-30,0)">⬅️</button>
  <button onclick="move(30,0)">➡️</button>
  <button onclick="move(0,30)">⬇️</button>
 </div>
 <p>Keyboard: WASD / Anak panah | Space: Tembak | T: Transform</p>
</div>

<div id="quiz">
 <h2>🕌 MISI KUIZ SOLAT</h2>
 <h3 id="question"></h3>
 <button onclick="readQuestion()">🔊 DENGAR SOALAN</button>
 <div id="answers"></div>
 <h3 id="feedback"></h3>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

// SVG watak terperinci
function sprite(svg){
 let img=new Image();
 img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
 return img;
}

const car=sprite(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100">
<defs>
 <linearGradient id="body" x2="0" y2="1">
  <stop stop-color="#ffb4e1"/><stop offset=".35" stop-color="#ff287b"/>
  <stop offset="1" stop-color="#a90050"/>
 </linearGradient>
 <linearGradient id="glass"><stop stop-color="#b9faff"/><stop offset="1" stop-color="#1680be"/></linearGradient>
 <radialGradient id="shine"><stop stop-color="white"/><stop offset="1" stop-color="#d6e8ff"/></radialGradient>
</defs>
<ellipse cx="90" cy="88" rx="80" ry="7" fill="#183d55" opacity=".3"/>
<path d="M12 65 L19 42 Q23 35 43 33 L65 12 Q72 5 94 8 L126 18 Q137 24 143 43 L164 50 Q174 54 174 69 L169 77 L8 77Z" fill="url(#body)" stroke="#6b1649" stroke-width="3"/>
<path d="M48 34 L69 14 Q74 11 92 13 L107 18 L117 37Z" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
<path d="M121 23 L135 42 L113 37 L101 18Z" fill="url(#glass)" stroke="#fff" stroke-width="2"/>
<path d="M16 53 Q83 44 158 54" fill="none" stroke="#ffb9dc" stroke-width="4"/>
<path d="M15 65 L31 61 L34 70 L13 70Z" fill="#fff6a0"/>
<path d="M146 59 L169 58 L168 68 L148 68Z" fill="#fff"/>
<path d="M53 44 L118 44" stroke="#ffdeef" stroke-width="3"/>
<circle cx="47" cy="75" r="17" fill="#25233b" stroke="#ddd" stroke-width="3"/>
<circle cx="47" cy="75" r="8" fill="#9ab6c7"/>
<circle cx="137" cy="75" r="17" fill="#25233b" stroke="#ddd" stroke-width="3"/>
<circle cx="137" cy="75" r="8" fill="#9ab6c7"/>
<path d="M72 55 L110 55" stroke="#fff" stroke-width="2" opacity=".6"/>
</svg>`);

const plane=sprite(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110">
<defs>
 <linearGradient id="p" x2="0" y2="1">
  <stop stop-color="#fff47a"/><stop offset=".4" stop-color="#ffb52b"/>
  <stop offset="1" stop-color="#e05b12"/>
 </linearGradient>
 <linearGradient id="w"><stop stop-color="#fff"/><stop offset="1" stop-color="#a3dfff"/></linearGradient>
</defs>
<ellipse cx="87" cy="91" rx="72" ry="6" fill="#245b7a" opacity=".2"/>
<path d="M12 48 L66 41 L91 4 L112 5 L106 42 L160 48 Q171 51 160 57 L107 65 L114 94 L99 96 L72 67 L14 61 Q2 57 12 48Z" fill="url(#p)" stroke="#a34b10" stroke-width="3"/>
<path d="M48 47 L76 46 L87 28 L100 27 L96 46 L146 51 L96 56 L83 54Z" fill="url(#w)" stroke="#fff" stroke-width="2"/>
<path d="M70 46 L94 45 L105 15 L119 15 L110 47 L153 52 L110 59 L115 89 L102 88 L90 59 L67 56Z" fill="#ffdf50" stroke="#c47b17" stroke-width="2"/>
<path d="M13 53 L5 48 L5 61 L16 60" fill="#ff386f"/>
<path d="M28 52 L45 51" stroke="#fff" stroke-width="3"/>
<circle cx="58" cy="53" r="4" fill="#fff"/>
</svg>`);

const enemies=[
 sprite(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
 <defs><linearGradient id="r"><stop stop-color="#ffb25a"/><stop offset="1" stop-color="#d92345"/></linearGradient></defs>
 <path d="M22 43 L12 22 L35 29 Q55 3 80 29 L106 18 L95 49 L102 78 L80 91 L35 91 L15 75Z" fill="url(#r)" stroke="#6d153e" stroke-width="4"/>
 <path d="M29 48 Q60 24 89 48 L84 73 L35 73Z" fill="#ffdf7b"/>
 <ellipse cx="43" cy="52" rx="10" ry="13" fill="#fff"/><ellipse cx="76" cy="52" rx="10" ry="13" fill="#fff"/>
 <circle cx="45" cy="54" r="5" fill="#321c48"/><circle cx="75" cy="54" r="5" fill="#321c48"/>
 <path d="M39 80 Q59 99 82 79" fill="none" stroke="#54203a" stroke-width="5"/>
 <path d="M23 89 L14 106 L40 99 L51 108 L65 97 L91 106 L90 89" fill="#bc2256"/>
 </svg>`),
 sprite(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
 <defs><linearGradient id="b"><stop stop-color="#b7a0ff"/><stop offset="1" stop-color="#5933c8"/></linearGradient></defs>
 <path d="M30 25 L17 9 L43 15 L59 4 L74 16 L101 8 L91 35 L106 69 L85 94 L30 94 L12 70Z" fill="url(#b)" stroke="#302071" stroke-width="4"/>
 <rect x="25" y="35" width="70" height="38" rx="15" fill="#4b287e"/>
 <circle cx="45" cy="52" r="12" fill="#b4ffff"/><circle cx="77" cy="52" r="12" fill="#b4ffff"/>
 <circle cx="45" cy="52" r="5" fill="#322052"/><circle cx="77" cy="52" r="5" fill="#322052"/>
 <path d="M43 77 Q60 90 82 76" stroke="#fff" stroke-width="4" fill="none"/>
 <path d="M34 91 L26 108 L52 100 L68 108 L88 91" fill="#7845d7"/>
 </svg>`),
 sprite(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
 <defs><linearGradient id="g"><stop stop-color="#aaff82"/><stop offset="1" stop-color="#1a9b60"/></linearGradient></defs>
 <path d="M20 43 L8 20 L34 30 L53 8 L68 27 L100 16 L91 45 L106 75 L82 94 L30 94 L13 73Z" fill="url(#g)" stroke="#126343" stroke-width="4"/>
 <ellipse cx="60" cy="57" rx="35" ry="28" fill="#168456"/>
 <circle cx="43" cy="49" r="12" fill="white"/><circle cx="77" cy="49" r="12" fill="white"/>
 <circle cx="45" cy="51" r="6" fill="#163b35"/><circle cx="75" cy="51" r="6" fill="#163b35"/>
 <path d="M37 76 Q60 95 84 76" fill="none" stroke="#d6ff9d" stroke-width="5"/>
 <path d="M30 88 L18 106 L48 99 L65 108 L91 94" fill="#207b55"/>
 </svg>`)
];

const bossSprite=sprite(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170">
<defs><linearGradient id="boss" x2="0" y2="1"><stop stop-color="#ff9be0"/><stop offset=".45" stop-color="#a52cff"/><stop offset="1" stop-color="#3d147d"/></linearGradient></defs>
<path d="M35 45 L18 9 L62 25 L90 2 L117 25 L161 9 L144 48 L167 105 L132 145 L48 145 L13 105Z" fill="url(#boss)" stroke="#40126f" stroke-width="6"/>
<path d="M35 52 Q90 28 145 52 L137 112 L45 112Z" fill="#6227a0"/>
<path d="M40 66 L70 57 L77 88 L44 91Z M104 57 L138 66 L134 91 L101 88Z" fill="#fff15c" stroke="#ffb629" stroke-width="5"/>
<circle cx="60" cy="75" r="9" fill="#e9004e"/><circle cx="120" cy="75" r="9" fill="#e9004e"/>
<path d="M59 115 Q90 142 122 115" stroke="#fff" stroke-width="7" fill="none"/>
<path d="M47 143 L31 166 L78 155 L92 169 L115 154 L151 165 L133 137" fill="#7c28c7"/>
</svg>`);

let player={x:75,y:210};
let bullets=[],foes=[],enemyShots=[],treasures=[],particles=[];
let score=0,gems=0,hp=3,hits=0,level=1,kills=0;
let active=false,paused=false,flying=false,boss=null;
let lastShot=0,lastSpawn=0,lastTreasure=0;
const questions=[
 ["Berapakah solat fardu sehari semalam?",["4","5","6","7"],1],
 ["Apakah solat pada waktu subuh?",["Subuh","Zohor","Asar","Isyak"],0],
 ["Berapakah rakaat solat Maghrib?",["2","3","4","5"],1],
 ["Ke arah manakah umat Islam menghadap ketika solat?",["Timur","Kiblat","Utara","Barat"],1],
 ["Apakah solat fardu selepas matahari terbenam?",["Subuh","Zohor","Maghrib","Asar"],2]
];
let qQueue=[];

function say(t){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(t);
 u.lang="ms-MY";u.rate=.85;
 speechSynthesis.speak(u);
}
function beep(f=500,d=.15){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 let a=new AC(),o=a.createOscillator(),g=a.createGain();
 o.connect(g);g.connect(a.destination);
 o.frequency.value=f;
 g.gain.setValueAtTime(.1,a.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
 o.start();o.stop(a.currentTime+d);
}
function message(t){document.getElementById("message").textContent=t}
function updateHUD(){
 document.getElementById("hp").textContent="❤️ "+hp;
 document.getElementById("score").textContent="⭐ "+score;
 document.getElementById("gems").textContent="💎 "+gems;
 document.getElementById("stage").textContent=
 "LEVEL "+level+" - "+["MUDAH","SEDANG","SUSAH SIKIT","SUSAH","AMAT SUSAH"][level-1];
}
function start(){
 player={x:75,y:210};
 bullets=[];foes=[];enemyShots=[];treasures=[];particles=[];
 score=0;gems=0;hp=3;hits=0;level=1;kills=0;
 boss=null;flying=false;active=true;paused=false;qQueue=[];
 lastSpawn=0;lastTreasure=0;
 document.getElementById("quiz").style.display="none";
 updateHUD();message("MISI BERMULA! HANCURKAN MUSUH!");
 say("Misi bermula!");
}
function transform(){
 if(!active||paused)return;
 flying=!flying;beep(300,.4);
 for(let i=0;i<20;i++)burst(player.x+30,player.y+15);
 message(flying?"✈️ KAPAL TERBANG! WHOOSH!":"🚗 KERETA!");
}
function move(x,y){
 if(!active||paused)return;
 player.x=Math.max(0,Math.min(810,player.x+x));
 player.y=Math.max(20,Math.min(450,player.y+y));
}
function shoot(){
 if(!active||paused||Date.now()-lastShot<230)return;
 lastShot=Date.now();
 bullets.push({x:player.x+55,y:player.y+30});
 beep(850,.1);
}
document.addEventListener("keydown",e=>{
 if(e.key===" "){e.preventDefault();shoot()}
 if(e.key.toLowerCase()==="t")transform();
 if(e.key==="ArrowUp"||e.key==="w")move(0,-20);
 if(e.key==="ArrowDown"||e.key==="s")move(0,20);
 if(e.key==="ArrowLeft"||e.key==="a")move(-20,0);
 if(e.key==="ArrowRight"||e.key==="d")move(20,0);
});

function burst(x,y){
 particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:30,
 color:["#ffed45","#ff43b0","#32eaff","#8cff51","#b85bff"][Math.floor(Math.random()*5)]});
}
function explosion(x,y){
 for(let i=0;i<30;i++)burst(x,y);
 beep(100,.25);
}
function spawnEnemy(){
 if(foes.length>=5||boss)return;
 let type=Math.floor(Math.random()*3);
 foes.push({x:930,y:50+Math.random()*350,hp:3,type});
}
function spawnTreasure(){
 treasures.push({x:930,y:50+Math.random()*370,type:Math.floor(Math.random()*3)});
}
function hit(a,b,d=35){
 return Math.abs(a.x-b.x)<d&&Math.abs(a.y-b.y)<d;
}
function damage(){
 if(paused||!active)return;
 hp--;hits++;beep(100,.3);
 if(hits>=3){showQuiz();return}
 if(hp<=0){active=false;message("GAME OVER! TEKAN MULA UNTUK CUBA LAGI.");say("Game over");}
}
function showQuiz(){
 paused=true;
 if(!qQueue.length)qQueue=[0,1,2,3,4].sort(()=>Math.random()-.5);
 let q=questions[qQueue.pop()];
 document.getElementById("question").textContent=q[0];
 document.getElementById("feedback").textContent="";
 let box=document.getElementById("answers");
 box.innerHTML="";
 q[1].forEach((a,i)=>{
 let b=document.createElement("button");
 b.textContent=["A","B","C","D"][i]+". "+a;
 b.onclick=()=>{
 if(i===q[2]){
 document.getElementById("feedback").textContent="BETUL! BOLEH SAMBUNG! 🎉";
 beep(1000,.4);
 hp=3;hits=0;
 setTimeout(()=>{
 document.getElementById("quiz").style.display="none";
 paused=false;message("HEBAT! TERUSKAN MISI!");
 updateHUD();
 },900);
 }else{
 document.getElementById("feedback").textContent="SALAH! CUBA LAGI 😊";
 beep(160,.3);
 }
 };
 box.appendChild(b);
 });
 document.getElementById("quiz").style.display="block";
 say(q[0]);
}
function readQuestion(){
 say(document.getElementById("question").textContent);
}

function nextLevel(){
 if(level<5){
 level++;kills=0;foes=[];enemyShots=[];bullets=[];boss=null;
 message("TAHNIAH! PERINGKAT "+level+"!");
 say("Peringkat "+level);
 }else{
 active=false;
 message("🏆 ANDA JUARA! SEMUA PERINGKAT SELESAI!");
 say("Tahniah! Anda juara!");
 }
}

function background(){
 let sky=ctx.createLinearGradient(0,0,0,500);
 sky.addColorStop(0,"#21caff");
 sky.addColorStop(.65,"#b1f6ff");
 sky.addColorStop(1,"#fff0ad");
 ctx.fillStyle=sky;ctx.fillRect(0,0,900,500);

 // Gunung
 ctx.fillStyle="#9d83db";
 ctx.beginPath();ctx.moveTo(0,340);ctx.lineTo(170,130);
 ctx.lineTo(340,340);ctx.lineTo(500,170);
 ctx.lineTo(720,345);ctx.lineTo(900,190);
 ctx.lineTo(900,500);ctx.lineTo(0,500);ctx.fill();

 // Puncak salji
 ctx.fillStyle="white";
 ctx.beginPath();ctx.moveTo(132,178);ctx.lineTo(170,130);
 ctx.lineTo(210,182);ctx.lineTo(180,169);ctx.lineTo(168,190);
 ctx.lineTo(154,172);ctx.fill();

 // Bandar
 for(let i=0;i<9;i++){
 let x=i*115;
 let h=65+(i*37)%90;
 ctx.fillStyle=["#ff77b7","#ffca52","#67caff","#8f72df"][i%4];
 ctx.fillRect(x,350-h,75,h);
 ctx.fillStyle="#fff5a2";
 for(let y=365-h;y<345;y+=24)
 for(let z=x+12;z<x+65;z+=25)
 ctx.fillRect(z,y,10,12);
 }
 // Jalan
 ctx.fillStyle="#515d85";ctx.fillRect(0,420,900,80);
 ctx.fillStyle="#fff";ctx.fillRect(0,457,900,5);
 for(let x=0;x<900;x+=100)ctx.fillRect(x,452,45,10);

 // Matahari
 ctx.fillStyle="#fff34b";
 ctx.beginPath();ctx.arc(770,75,43,0,7);ctx.fill();

 // Awan
 ctx.fillStyle="white";
 for(let i=0;i<4;i++){
 let x=(i*245+60)%900,y=75+i%2*65;
 ctx.beginPath();
 ctx.arc(x,y,23,0,7);ctx.arc(x+27,y-10,30,0,7);
 ctx.arc(x+58,y,24,0,7);ctx.fill();
 }
}

function draw(){
 background();

 // Watak pemain
 let img=flying?plane:car;
 if(img.complete&&img.naturalWidth)
 ctx.drawImage(img,player.x,player.y,flying?100:105,flying?65:60);

 bullets.forEach(b=>{
 ctx.fillStyle="#fff400";ctx.shadowBlur=12;ctx.shadowColor="#ff6500";
 ctx.fillRect(b.x,b.y,24,8);ctx.shadowBlur=0;
 });

 foes.forEach(e=>{
 let im=enemies[e.type];
 if(im.complete&&im.naturalWidth)
 ctx.drawImage(im,e.x,e.y,75,75);
 ctx.fillStyle="#f33";
 ctx.fillRect(e.x,e.y-9,70,6);
 ctx.fillStyle="#50ed62";
 ctx.fillRect(e.x,e.y-9,70*e.hp/3,6);
 });

 treasures.forEach(t=>{
 ctx.font="34px Arial";
 ctx.fillText(["🪙","💎","🦪"][t.type],t.x,t.y);
 });

 enemyShots.forEach(b=>{
 ctx.font="23px Arial";ctx.fillText("🔥",b.x,b.y);
 });

 if(boss&&bossSprite.complete&&bossSprite.naturalWidth){
 ctx.drawImage(bossSprite,boss.x,boss.y,150,145);
 ctx.fillStyle="red";ctx.fillRect(boss.x,boss.y-13,140,10);
 ctx.fillStyle="#53ff54";ctx.fillRect(boss.x,boss.y-13,140*boss.hp/15,10);
 }

 particles.forEach(p=>{
 ctx.fillStyle=p.color;ctx.globalAlpha=p.life/30;
 ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();
 ctx.globalAlpha=1;
 });

 if(!active){
 ctx.fillStyle="#fff";
 ctx.font="bold 30px Arial";
 ctx.textAlign="center";
 ctx.fillText("RAINBOW TRANSFORMER HERO",450,245);
 ctx.textAlign="left";
 }
}

function update(){
 if(!active||paused)return;
 let speed=[1,1.5,2.1,2.8,3.5][level-1];

 bullets.forEach(b=>b.x+=11);

 foes.forEach(e=>{
 e.x-=speed;
 if(Math.random()<[.004,.012,.02,.032,.05][level-1])
 enemyShots.push({x:e.x,y:e.y+35});
 });

 bullets.forEach(b=>{
 foes.forEach(e=>{
 if(!b.used&&hit(b,{x:e.x+35,y:e.y+35},40)){
 b.used=true;e.hp--;
 if(e.hp<=0){
 score+=100;kills++;explosion(e.x,e.y);
 if(Math.random()<.6)
 treasures.push({x:e.x,y:e.y,type:Math.floor(Math.random()*3)});
 }
 }
 });
 });

 bullets=bullets.filter(b=>b.x<900&&!b.used);
 foes=foes.filter(e=>e.hp>0&&e.x>-100);

 if(level===5&&kills>=6&&!boss){
 boss={x:730,y:170,hp:15};
 say("Boss terakhir datang!");
 }
 if(boss){
 boss.x=Math.max(680,boss.x-.2);
 boss.y=160+Math.sin(Date.now()/350)*30;
 if(Math.random()<.04)enemyShots.push({x:boss.x,y:boss.y+60});
 bullets.forEach(b=>{
 if(!b.used&&hit(b,{x:boss.x+65,y:boss.y+65},80)){
 b.used=true;boss.hp--;
 if(boss.hp<=0){
 score+=1000;explosion(boss.x,boss.y);
 boss=null;nextLevel();
 }
 }
 });
 }

 enemyShots.forEach(b=>{
 b.x-=5;
 if(!b.used&&hit(b,{x:player.x+45,y:player.y+30},35)){
 b.used=true;damage();
 }
 });
 enemyShots=enemyShots.filter(b=>b.x>0&&!b.used);

 treasures.forEach(t=>t.x-=2);
 treasures=treasures.filter(t=>{
 if(hit(t,{x:player.x+45,y:player.y+30},40)){
 score+=t.type===1?50:20;gems++;
 beep(1100,.15);
 for(let i=0;i<12;i++)burst(t.x,t.y);
 return false;
 }
 return t.x>-50;
 });

 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});
 particles=particles.filter(p=>p.life>0);

 if(level<5&&kills>=6)nextLevel();
 updateHUD();
}

function loop(){
 let now=Date.now();
 if(active&&!paused){
 if(now-lastSpawn>Math.max(450,1400-level*150)){
 spawnEnemy();lastSpawn=now;
 }
 if(now-lastTreasure>3000){
 spawnTreasure();lastTreasure=now;
 }
 }
 update();draw();
 requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
</body>
</html>
